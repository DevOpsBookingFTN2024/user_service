spring.application.name=user_service

#spring.datasource.url=jdbc:postgresql://postgresql-db-user:5432/user_db
spring.datasource.url=jdbc:postgresql://localhost:5432/user_db?useSSL=false
spring.datasource.username=postgres
spring.datasource.password=admin

spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update

accommodation.service.url=http://accommodation-service:8082
reservation.service.url=http://reservation-service:8083
notification.service.url=http://notification-service:8085

server.port=8081

management.endpoint.health.probes.enabled=true
# management.health.livenessState.enabled=true
# management.health.readinessState.enabled=true
management.endpoints.web.exposure.include=*
# management.endpoints.web.exposure.include=info,health,metrics,prometheus
management.metrics.tags.application=user-service
management.server.port=8081
otel.exporter.otlp.endpoint=http://jaeger-collector.monitoring.svc.cluster.local:4317
management.tracing.sampling.probability=1.0


logging.level.org.springframework.web=INFO
loki.url=http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push
logging.level.root=INFO